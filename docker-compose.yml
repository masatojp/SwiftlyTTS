# SwiftlyTTS ボット + Postgres + Voicevox 用の docker-compose
# 使用方法:
# - 開始: docker compose up -d
# - 停止: docker compose down
# 注意事項:
# - シークレット情報はプロジェクトルートの .env ファイルに保存するか、環境変数で渡してください。
# - .env ファイルに必要な env (例):
# DISCORD_TOKEN=your_token_here
# SHARD_COUNT=3
# DB_NAME=swiftlytts
# DB_USER=swiftlytts
# DB_PASSWORD=change-me
# - VOICEVOX: Compose はデフォルトで公式エンジンイメージ名を使用します。必要に応じてタグを変更してください。

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: swiftlytts-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-swiftlytts}
      POSTGRES_USER: ${DB_USER:-swiftlytts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swiftlytts}
    volumes:
      - db_data:/var/lib/postgresql/data
    # ホスト側へのポート公開は不要(bot からは compose 内ネットワークで postgres:5432 に接続する)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-swiftlytts}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  voicevox:
    # CPU 版を常駐させる。バージョンは固定し、更新時は VOICEVOX_ENGINE_TAG で切り替える
    # (英単語の読みなど、読みの挙動が Engine のバージョンで変わるため)
    image: voicevox/voicevox_engine:${VOICEVOX_ENGINE_TAG:-cpu-0.26.2}
    container_name: swiftlytts-voicevox
    environment:
      # 合成に使うスレッド数。サーバーのコア数以内にする(超えると遅くなる)。
      # 実測(2コア割当): 1本=82秒, 2本=43秒, 3本=45秒(91文字の文章)
      VV_CPU_NUM_THREADS: ${VV_CPU_NUM_THREADS:-2}
      # Engine 側の辞書・設定を変更する API を無効化する(Bot は使わない。外部からの書き換え防止)
      VV_DISABLE_MUTABLE_API: ${VV_DISABLE_MUTABLE_API:-1}
    # --load_all_models は付けない: 使われた話者のモデルだけを読み込み、メモリを節約する
    ports:
      - "50021:50021" # API
    restart: unless-stopped
    healthcheck:
      # イメージに curl が無いため bash の /dev/tcp で /version を確認する
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50021 && printf 'GET /version HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiftlytts-bot
    env_file:
      - .env
    environment:
      # DB 接続先は .env の値を優先する(外部DBを使う場合は .env に DB_HOST 等を設定)
      # 未設定の場合のみ compose 内の postgres サービスを参照する
      # 注意: environment は env_file より優先されるため、固定値を書くと .env が無視される
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSL: ${DB_SSL:-false}
      DB_NAME: ${DB_NAME:-swiftlytts}
      DB_USER: ${DB_USER:-swiftlytts}
      DB_PASSWORD: ${DB_PASSWORD:-swiftlytts}
      # VOICEVOX サーバーの URL。デフォルトは compose 内の voicevox サービスを指す
      # 環境変数や .env で上書き可能（例: VOICEVOX_URL=http://external-voicevox:50021）
      VOICEVOX_URL: ${VOICEVOX_URL:-http://voicevox:50021}
      SHARD_COUNT: ${SHARD_COUNT:-3}
      # DISCORD_TOKEN は .env や環境変数で提供してください
    depends_on:
      postgres:
        condition: service_healthy
      voicevox:
        condition: service_healthy
    volumes:
      # 注意: ./:/app をマウントすると、イメージ内の /app/.venv(依存パッケージ)がホストの内容で隠れて
      # ModuleNotFoundError になるため、ソース全体のマウントは行わない
      - ./config.yml:/app/config.yml
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: swiftlytts-adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  db_data:
    name: swiftlytts_db_data

networks:
  default:
    name: swiftlytts_default
